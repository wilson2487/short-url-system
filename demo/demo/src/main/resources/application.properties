# 應用配置
spring.application.name=short-url-system
server.port=${PORT:8080}

# 資料庫配置 (自動讀取 Render 環境變數)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/defaultdb?useSSL=false}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Redis 配置 (自動讀取 Render 環境變數)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0
spring.data.redis.timeout=2000ms
spring.data.redis.ssl.enabled=true

# RabbitMQ 配置 (自動讀取 Render 環境變數，CloudAMQP 需開啟 SSL/TLS)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST}
spring.rabbitmq.ssl.enabled=true
spring.rabbitmq.listener.simple.missing-queues-fatal=false

# 日誌配置
logging.level.root=INFO
logging.level.com.example.demo=DEBUG
